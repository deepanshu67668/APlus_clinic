<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Radial Gradient -->
    <radialGradient id="goldRadial" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Gold Metallic Linear Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#fffbeb" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Royal Blue Inner Shield Gradient -->
    <linearGradient id="blueShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Scalloped Outer Gold Medallion Ring (32 Points) -->
    <path d="
      M 100 10 
      Q 104 15 109 11 Q 114 17 119 14 Q 123 20 128 18 Q 132 25 137 24 Q 140 31 145 31 Q 148 38 153 39 Q 155 46 159 48 Q 160 55 164 58 Q 164 66 168 69 Q 167 77 170 81 Q 168 89 170 93 Q 167 101 168 105 Q 164 113 164 117 Q 160 124 159 128 Q 155 135 153 139 Q 148 145 145 150 Q 140 155 137 160 Q 132 164 128 169 Q 123 172 119 177 Q 114 179 109 184 Q 104 184 100 189
      Q 96 184 91 184 Q 86 179 81 177 Q 77 172 72 169 Q 68 164 63 160 Q 60 155 55 150 Q 52 145 47 139 Q 45 135 41 128 Q 40 124 36 117 Q 36 113 32 105 Q 33 101 30 93 Q 32 89 30 81 Q 33 77 32 69 Q 36 66 36 58 Q 40 55 41 48 Q 45 46 47 39 Q 52 38 55 31 Q 60 31 63 24 Q 68 25 72 18 Q 77 20 81 14 Q 86 17 91 11 Q 96 15 100 10 Z" 
      fill="url(#goldLinear)" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Inner Gold Bezel -->
    <circle cx="100" cy="100" r="76" fill="url(#goldRadial)" stroke="#78350f" stroke-width="2" />
    <circle cx="100" cy="100" r="70" fill="none" stroke="#fffbeb" stroke-width="1.5" stroke-dasharray="3 2" />

    <!-- Royal Blue Center Core -->
    <circle cx="100" cy="100" r="64" fill="url(#blueShield)" stroke="#fef08a" stroke-width="2" />

    <!-- Top Ribbon Header Text -->
    <text x="100" y="55" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#fef08a" text-anchor="middle" letter-spacing="2">★ CERTIFIED ★</text>
    
    <!-- Big ISO Title -->
    <text x="100" y="85" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ISO</text>
    
    <!-- ISO Standard Number -->
    <text x="100" y="106" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="15" fill="#38bdf8" text-anchor="middle" letter-spacing="1">9001:2015</text>

    <!-- Divider Line -->
    <line x1="45" y1="116" x2="155" y2="116" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />

    <!-- Subtitle -->
    <text x="100" y="130" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="700" font-size="8.5" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.2">QUALITY MANAGEMENT</text>
    <text x="100" y="142" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="700" font-size="7.5" fill="#fef08a" text-anchor="middle" letter-spacing="1">SYSTEM FACILITY</text>
    
    <!-- Bottom Stars -->
    <text x="100" y="156" font-family="'Outfit', sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" letter-spacing="3">★★★★★</text>
  </g>
</svg>
